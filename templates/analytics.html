{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<div class="analytics-page">
    <div class="analytics-coming-soon">
        <div class="analytics-icon-wrap">
            <i data-lucide="clock" class="analytics-icon"></i>
        </div>
        <span class="analytics-badge">COMING SOON</span>
        <h1 class="analytics-title">Advanced Analytics</h1>
        <p class="analytics-desc">We're working on powerful insights and visualizations to help you understand your spending patterns better.</p>
        <div class="analytics-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <p class="analytics-crafting">We're crafting something special</p>
    </div>
</div>

<style>
.analytics-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 60px - 100px);
    padding: 2rem;
}

.analytics-coming-soon {
    background: var(--paper-card);
    border-radius: var(--radius-lg);
    padding: 3rem 2.5rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
}

.analytics-coming-soon::before,
.analytics-coming-soon::after {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--paper-warm);
    opacity: 0.6;
}

.analytics-coming-soon::before { top: -40px; right: -40px; }
.analytics-coming-soon::after  { bottom: -40px; left: -40px; }

.analytics-icon-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    background: var(--accent);
    border-radius: var(--radius-md);
    margin-bottom: 1.5rem;
    position: relative;
    z-index: 1;
}

.analytics-icon {
    width: 36px;
    height: 36px;
    color: #ffffff;
    stroke-width: 1.5;
}

.analytics-badge {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding: 0.4rem 1.1rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
    position: relative;
    z-index: 1;
}

.analytics-title {
    font-family: var(--font-display);
    font-size: 1.75rem;
    color: var(--ink);
    margin-bottom: 0.75rem;
    position: relative;
    z-index: 1;
}

.analytics-desc {
    color: var(--ink-muted);
    font-size: 0.95rem;
    line-height: 1.65;
    margin-bottom: 1.75rem;
    position: relative;
    z-index: 1;
}

.analytics-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    position: relative;
    z-index: 1;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
}

.dot:nth-child(2) { background: var(--ink-faint); }

.analytics-crafting {
    color: var(--ink-faint);
    font-size: 0.85rem;
    position: relative;
    z-index: 1;
}
</style>
{% endblock %}
